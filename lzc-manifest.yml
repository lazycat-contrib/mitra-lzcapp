application:
  subdomain: mitra
  background_task: true
  multi_instance: false
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://mitra:3000/
services:
  mitra:
    # upstream: ghcr.io/a11delavar/mitra:latest@sha256:d9546ac0e5058e30cef9b2465656b92f307dd4dc8587fad518378d3dde45e206
    image: ghcr.nju.edu.cn/a11delavar/mitra:latest@sha256:d9546ac0e5058e30cef9b2465656b92f307dd4dc8587fad518378d3dde45e206
    environment:
      - TZ=Asia/Shanghai
    binds:
      - /lzcapp/var/mitra:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
