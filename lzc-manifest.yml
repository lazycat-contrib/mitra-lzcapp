application:
  subdomain: mitra
  background_task: true
  multi_instance: false
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://mitra:3000/

services:
  mitra:
    # upstream: ghcr.io/a11delavar/mitra:latest (= v0.6.1, GHCR 无版本 tag)
    image: ghcr.1ms.run/a11delavar/mitra:latest@sha256:1fc1b669e841331cbfea1c25e762969a880c3ba344bd802a32920b1bd563af6a
    environment:
      - TZ=Asia/Shanghai
    binds:
      - /lzcapp/var/mitra:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
