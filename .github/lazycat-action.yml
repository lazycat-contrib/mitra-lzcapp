version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/mitra.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: mitra
    bump: patch

build:
  run_buildscript: false

images:
  # 上游 GHCR 无版本 tag（latest/dev/sha-*），用 latest digest 比对 + patch 自增
  - id: mitra
    target: service
    service: mitra
    source: ghcr.io/a11delavar/mitra
    channel: custom
    sort: created
    tag_regex: '^latest$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Mitra
    summary: "一体化日历：事件与任务规划"
